[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "durparse"
version = "0.1.0"
description = "Parse human duration strings into seconds or other units"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = []

[project.scripts]
durparse = "durparse.cli:main"

[tool.setuptools]
packages = ["durparse"]
